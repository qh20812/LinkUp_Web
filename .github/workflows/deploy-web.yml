name: Deploy Web

on:
  push:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: linkup-web:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=server:8080

      - name: Save image
        run: |
          docker save linkup-web | gzip > /tmp/web.tar.gz

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: /tmp/web.tar.gz
          target: /tmp/
          strip_components: 2

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/linkup/web
            git pull origin main
            docker load -i /tmp/web.tar.gz
            cd /opt/linkup
            docker compose up -d web
            echo "Waiting for web..."
            sleep 5
            curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/ || exit 1
            echo "WEB OK"

      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} <b>Web Deploy</b>
            Repo: <a href="${{ github.server_url }}/${{ github.repository }}">LinkUp_Web</a>
            Commit: ${{ github.event.head_commit.message || 'manual' }}
            Status: <b>${{ job.status }}</b>
