services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: linkup-web-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    env_file:
      - .env.local
    environment:
      - NEXT_PUBLIC_API_BASE_URL=host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  web-node-modules:
